# A release for each version tag (v0.1.0-alpha, ...): build and test on
# Linux, make the packages (make dist: a static cobalt for Linux, cobalt.exe
# for Windows, checked with the examples) and publish them as a GitHub
# release whose notes are the version's section of CHANGELOG.md. Versions
# with a pre-release part (-alpha, -beta) are marked as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: The tag names this version
        run: |
          version=$(sed -n 's/.*COBALT_VERSION "\(.*\)".*/\1/p' include/version.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but include/version.h says $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test
        run: make && make test
      - name: Packages
        run: make dist
      - name: Release notes (CHANGELOG.md)
        run: |
          awk -v v="$VERSION" '
            /^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v; next }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: cobalt ${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            obj/dist/cobalt-${{ env.VERSION }}-linux-x86_64.tar.gz
            obj/dist/cobalt-${{ env.VERSION }}-windows-x86_64.zip
            obj/dist/SHA256SUMS
